name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gutenjpfont/package-lock.json
      - run: npm ci && npm run build
        working-directory: gutenjpfont
      - run: python3 tools/package.py
      - name: Create release
        id: create_release
        uses: actions/create-release@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: .artifacts/japanese-font-wordpress.zip
          asset_name: japanese-font-wordpress.zip
          asset_content_type: application/zip
      - name: Prepare WordPress.org package
        run: |
          mkdir -p .wordpress-org-build
          unzip -q .artifacts/japanese-font-wordpress.zip -d .wordpress-org-build
      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          BUILD_DIR: .wordpress-org-build/japanese-font-for-tinymce
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: japanese-font-for-tinymce # optional, remove if GitHub repo name matches SVN slug, including capitalization
