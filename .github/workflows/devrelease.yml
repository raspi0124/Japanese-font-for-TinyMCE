name: Dev Release
on:
  push:
    tags: ['dev*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gutenjpfont/package-lock.json
      - run: npm ci && npm run build
        working-directory: gutenjpfont
      - run: python3 tools/package.py
      - name: Check runtime PHP syntax
        run: find . -path './gutenjpfont/node_modules' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      # Public prereleases use the exact ZIP verified in the browser matrix.
      # CI artifacts are candidates and never replace a tested release asset.
      - uses: actions/upload-artifact@v4
        with:
          name: development-zip-candidate
          path: .artifacts/japanese-font-wordpress.zip
