name: Dev Release
on:
  push:
    tags: ['dev*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gutenjpfont/package-lock.json
      - run: npm ci && npm run build
        working-directory: gutenjpfont
      - run: python3 tools/package.py
      - name: Check runtime PHP syntax
        run: find . -path './gutenjpfont/node_modules' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Publish development ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .artifacts/japanese-font-wordpress.zip --prerelease --verify-tag --generate-notes
